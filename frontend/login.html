<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Carpool Finder</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="logo">🚗 Carpool Finder</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="rides.html">Find Ride</a>
        <a href="offer-ride.html">Offer Ride</a>
      </nav>
      <div class="auth-links">
        <a href="register.html" class="btn btn-primary">Register</a>
      </div>
    </div>
  </header>

  <main class="container auth-page">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="auth-subtitle">Sign in to manage your rides</p>

      <form data-auth-form data-endpoint="/auth/login" data-submit-text="Login">
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Enter your password" required />
        </div>

        <button type="submit" class="btn btn-primary btn-block">Login</button>
        <p class="form-message" data-message></p>
      </form>

      <p class="auth-switch">
        New here? <a href="register.html">Create an account</a>
      </p>
    </div>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
