<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Find a Ride | Carpool Finder</title>
  <meta name="theme-color" content="#fefcf9" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="rides">
  <header class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="logo"><span class="logo-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="m5 13 1.3-4.2A2.5 2.5 0 0 1 8.7 7h6.6a2.5 2.5 0 0 1 2.4 1.8L19 13v5h-2v-2H7v2H5v-5Z"/><path d="M5 13h14M8 16h.01M16 16h.01"/></svg></span>Carpool Finder</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="rides.html" aria-current="page">Find Ride</a>
        <a href="offer-ride.html">Offer Ride</a>
        <a href="requests.html">Requests</a>
        <a href="dashboard.html">Dashboard</a>
      </nav>
      <div class="auth-links">
        <a href="login.html" class="btn btn-outline" data-auth="login">Login</a>
        <a href="register.html" class="btn btn-primary" data-auth="register">Register</a>
      </div>
    </div>
  </header>

  <main class="container page-shell">
    <section class="content-panel">
      <div class="panel-header">
        <div>
          <p class="eyebrow">Your next shared journey</p>
          <h1>Find a ride that fits.</h1>
          <p class="page-intro">A familiar route can feel different with the right company.</p>
        </div>
        <a href="offer-ride.html" class="btn btn-primary">Offer a ride</a>
      </div>

      <form class="filter-form" data-trip-filter>
        <div class="form-group inline-group">
          <label for="start_location">From</label>
          <input id="start_location" name="start_location" type="text" placeholder="e.g. Downtown" />
        </div>
        <div class="form-group inline-group">
          <label for="destination">To</label>
          <input id="destination" name="destination" type="text" placeholder="e.g. Campus" />
        </div>
        <div class="form-group inline-group">
          <label for="trip_date">Date</label>
          <input id="trip_date" name="trip_date" type="date" />
        </div>
        <div class="form-group inline-group">
          <label for="sort">Sort</label>
          <select id="sort" name="sort">
            <option value="departure">Soonest departure</option>
            <option value="newest">Recently posted</option>
          </select>
        </div>
        <div class="form-group inline-group">
          <label for="min_seats">Seats</label>
          <select id="min_seats" name="min_seats">
            <option value="">Any seats</option>
            <option value="2">2 or more</option>
            <option value="3">3 or more</option>
            <option value="4">4 or more</option>
            <option value="5">5 or more</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary">Search</button>
      </form>

      <div id="trip-list" class="trip-list" aria-live="polite"></div>
    </section>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
