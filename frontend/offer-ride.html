<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offer a Ride | Carpool Finder</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="offer-ride">
  <header class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="logo">🚗 Carpool Finder</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="rides.html">Find Ride</a>
        <a href="offer-ride.html">Offer Ride</a>
        <a href="requests.html">Requests</a>
        <a href="dashboard.html">Dashboard</a>
      </nav>
      <div class="auth-links">
        <a href="login.html" class="btn btn-outline" data-auth="login">Login</a>
        <a href="register.html" class="btn btn-primary" data-auth="register">Register</a>
      </div>
    </div>
  </header>

  <main class="container auth-page">
    <div class="auth-card wide-card">
      <h1>Offer a ride</h1>
      <p class="auth-subtitle">Share your available seats and help someone travel.</p>

      <form data-offer-form>
        <div class="two-column">
          <div class="form-group">
            <label for="start_location">Starting location</label>
            <input id="start_location" name="start_location" type="text" placeholder="Downtown" required />
          </div>

          <div class="form-group">
            <label for="destination">Destination</label>
            <input id="destination" name="destination" type="text" placeholder="University" required />
          </div>
        </div>

        <div class="two-column">
          <div class="form-group">
            <label for="trip_date">Trip date</label>
            <input id="trip_date" name="trip_date" type="date" required />
          </div>

          <div class="form-group">
            <label for="departure_time">Departure time</label>
            <input id="departure_time" name="departure_time" type="time" required />
          </div>
        </div>

        <div class="two-column">
          <div class="form-group">
            <label for="available_seats">Available seats</label>
            <input id="available_seats" name="available_seats" type="number" min="1" value="1" required />
          </div>

          <div class="form-group">
            <label for="vehicle">Vehicle</label>
            <input id="vehicle" name="vehicle" type="text" placeholder="Toyota Corolla" />
          </div>
        </div>

        <div class="form-group">
          <label for="notes">Notes</label>
          <textarea id="notes" name="notes" rows="4" placeholder="Any extra details about the trip"></textarea>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Post ride</button>
        <p class="form-message" data-message></p>
      </form>
    </div>
  </main>

  <section class="container page-shell">
    <div class="request-panel">
      <div class="panel-header">
        <div>
          <p class="eyebrow">Your trips</p>
          <h2>My posted rides</h2>
        </div>
      </div>
      <div id="my-offers" class="trip-list"></div>
    </div>

    <div class="request-panel">
      <div class="panel-header">
        <div>
          <p class="eyebrow">Requests</p>
          <h2>People asking to join</h2>
        </div>
      </div>
      <div id="ride-requests" class="requests-grid"></div>
    </div>
  </section>

  <script src="js/auth.js"></script>
</body>
</html>
