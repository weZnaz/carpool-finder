services:
  - type: web
    name: carpool-finder
    runtime: node
    plan: free
    buildCommand: npm --prefix backend install
    startCommand: npm --prefix backend start
    healthCheckPath: /api/health
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_AUTO_CREATE
        value: "false"
      - key: DB_SSL
        value: "false"
      - key: JWT_SECRET
        generateValue: true